<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Printing Ustad | Premium Custom Printing Studio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f6f6f6",
                        "secondary": "#d3fbff",
                        "secondary-container": "#00eefc",
                        "surface": "#131313",
                        "surface-container": "#201f1f",
                        "surface-container-high": "#2a2a2a",
                        "on-surface": "#e5e2e1",
                        "on-surface-variant": "#b9cacb"
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; background-color: #131313; color: #e5e2e1; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased">
    <!-- TopNavBar -->
    <nav class="fixed top-0 w-full z-50 bg-[#131313]/60 backdrop-blur-xl border-b border-white/10 h-20 flex items-center px-8 shadow-[0_0_40px_rgba(0,240,255,0.06)]">
        <div class="flex items-center justify-between w-full max-w-[1440px] mx-auto">
            <div class="flex items-center gap-12">
                <a href="index.html" class="flex items-center gap-4 group">
                    <div class="h-16 w-20 transition-all duration-300 group-hover:scale-110 flex items-center justify-center">
                        <img src="logo.png" alt="Printing Ustad" class="h-full w-full object-contain filter drop-shadow-[0_0_15px_rgba(0,240,255,0.5)] brightness-110 mix-blend-screen">
                    </div>
                    <div class="flex flex-col">
                        <span class="text-2xl font-bold tracking-tighter text-neutral-50 font-headline leading-none">Printing Ustad</span>
                        <span class="text-[10px] uppercase tracking-[0.2em] text-cyan-400 font-bold mt-1 opacity-80">Premium Studio</span>
                    </div>
                </a>
            </div>
            <div class="flex items-center gap-6">
                <a href="shop.html" class="text-sm font-bold text-neutral-400 hover:text-white transition-colors">Continue Shopping</a>
                <div class="relative p-2">
                    <span class="material-symbols-outlined text-2xl text-primary">shopping_cart</span>
                    <span class="cart-badge absolute -top-1 -right-1 bg-secondary-container text-black text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-surface">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-24 pb-20 max-w-[1200px] mx-auto px-6">
        <h1 class="text-4xl font-extrabold tracking-tighter mb-10">Studio Cart</h1>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <!-- Cart Items List -->
            <div class="lg:col-span-8 space-y-6" id="cart-items-container">
                <!-- Items will be injected here by JS -->
                <div class="flex flex-col items-center justify-center py-20 text-on-surface-variant opacity-50" id="empty-cart-msg">
                    <span class="material-symbols-outlined text-6xl mb-4">shopping_basket</span>
                    <p class="text-lg">Your cart is currently empty.</p>
                    <a href="shop.html" class="mt-6 text-secondary-container font-bold hover:underline">Start designing products</a>
                </div>
            </div>

            <!-- Order Summary Sidebar -->
            <div class="lg:col-span-4">
                <div class="bg-surface-container-high p-8 rounded-2xl border border-white/5 sticky top-24">
                    <h2 class="text-xl font-bold mb-6">Order Summary</h2>
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-on-surface-variant">Subtotal</span>
                            <span id="subtotal-val">₹0.00</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-on-surface-variant">Shipping</span>
                            <span id="shipping-val">₹0.00</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-on-surface-variant">Tax</span>
                            <span id="tax-val">₹0.00</span>
                        </div>
                        <div class="w-full h-[1px] bg-white/10 my-2"></div>
                        <div class="flex justify-between items-center font-bold text-lg mb-4">
                            <span>Total</span>
                            <span id="total-val" class="text-secondary-container">₹0.00</span>
                        </div>
                    </div>
                    <button id="checkout-btn" class="w-full py-4 bg-primary text-black font-extrabold rounded-xl hover:scale-[1.02] active:scale-[0.98] transition-transform shadow-xl">
                        Proceed to Checkout
                    </button>
                    <div class="mt-6 flex items-center justify-center gap-4 grayscale opacity-50">
                        <span class="material-symbols-outlined">payments</span>
                        <span class="material-symbols-outlined">credit_card</span>
                        <span class="material-symbols-outlined">account_balance</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();

            // Listen for cart updates
            window.addEventListener('cartUpdated', () => renderCart());

        // Checkout Button
        document.getElementById('checkout-btn').addEventListener('click', () => {
            const cart = CartSystem.getCart();
            if (cart.length === 0) {
                CartSystem.showToast("Your cart is empty!");
                return;
            }
            
            const btn = document.getElementById('checkout-btn');
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Processing...`;
            btn.disabled = true;
            
            // Simulate processing time
            setTimeout(() => {
                // Clear cart
                CartSystem.saveCart([]);
                // Redirect to success page
                window.location.href = "success.html";
            }, 1000);
        });
        });

        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const cart = CartSystem.getCart();
            const emptyMsg = document.getElementById('empty-cart-msg');

            // Clear previous items but keep the empty message container
            const itemElements = container.querySelectorAll('.cart-item');
            itemElements.forEach(el => el.remove());

            if (cart.length === 0) {
                emptyMsg.style.display = 'flex';
                updateTotals(0);
                return;
            }

            emptyMsg.style.display = 'none';
            let subtotal = 0;

            cart.forEach(item => {
                subtotal += (item.price * item.quantity);
                
                const itemEl = document.createElement('div');
                itemEl.className = 'cart-item flex gap-6 p-6 bg-surface-container rounded-2xl border border-white/5 group';
                
                const attrHtml = Object.entries(item.attributes || {})
                    .map(([key, val]) => `<span class="text-[10px] uppercase tracking-widest bg-white/5 px-2 py-0.5 rounded text-on-surface-variant font-bold">${key}: ${val}</span>`)
                    .join(' ');

                itemEl.innerHTML = `
                    <div class="w-24 h-24 rounded-xl overflow-hidden bg-black/20 flex-shrink-0">
                        <img src="${item.image}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-lg text-primary">${item.name}</h3>
                                <button onclick="CartSystem.removeItem('${item.uniqueId}')" class="text-on-surface-variant hover:text-red-400 transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">delete</span>
                                </button>
                            </div>
                            <div class="flex gap-2 mt-2">
                                ${attrHtml}
                            </div>
                        </div>
                        <div class="flex justify-between items-end mt-4">
                            <div class="flex items-center bg-black/40 rounded-lg px-2 py-1">
                                <button onclick="CartSystem.updateQuantity('${item.uniqueId}', -1)" class="p-1 hover:text-white"><span class="material-symbols-outlined text-sm">remove</span></button>
                                <span class="w-8 text-center text-sm font-bold">${item.quantity}</span>
                                <button onclick="CartSystem.updateQuantity('${item.uniqueId}', 1)" class="p-1 hover:text-white"><span class="material-symbols-outlined text-sm">add</span></button>
                            </div>
                            <span class="font-headline font-extrabold text-secondary-container text-lg">₹${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                    </div>
                `;
                container.appendChild(itemEl);
            });

            updateTotals(subtotal);
        }

        function updateTotals(subtotal) {
            const shipping = subtotal > 0 ? 50.00 : 0; // Flat INR 50 Shipping
            const tax = subtotal * 0.18; // 18% GST Example
            const total = subtotal + shipping + tax;

            document.getElementById('subtotal-val').innerText = `₹${subtotal.toFixed(2)}`;
            document.getElementById('shipping-val').innerText = `₹${shipping.toFixed(2)}`;
            document.getElementById('tax-val').innerText = `₹${tax.toFixed(2)}`;
            document.getElementById('total-val').innerText = `₹${total.toFixed(2)}`;
        }
    </script>
</body>
</html>
