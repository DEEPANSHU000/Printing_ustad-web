<script src="app.js"></script>
<script>
    // Real-time Canvas Update
    const textInput = document.getElementById('text-input');
    const canvasText = document.getElementById('canvas-text');
    const fontSelect = document.getElementById('font-select');
    const colorPickers = document.querySelectorAll('.color-picker');

    textInput.addEventListener('input', (e) => {
        canvasText.innerText = e.target.value.toUpperCase() || ' '; // fallback to space to keep height
    });

    fontSelect.addEventListener('change', (e) => {
        canvasText.style.fontFamily = e.target.value;
    });

    colorPickers.forEach(picker => {
        picker.addEventListener('click', () => {
            const color = picker.getAttribute('data-color');
            canvasText.style.color = color;
            
            // Highlight
            colorPickers.forEach(p => {
                p.classList.remove('scale-110', 'ring-2', 'ring-secondary-container', 'ring-offset-2', 'ring-offset-neutral-900');
            });
            picker.classList.add('scale-110', 'ring-2', 'ring-secondary-container', 'ring-offset-2', 'ring-offset-neutral-900');
        });
    });

    // Add to Cart Studio Feedback
    const addBtnStudio = document.getElementById('add-to-cart-studio');
    addBtnStudio.addEventListener('click', () => {
        const item = {
            id: 'custom-print-001',
            name: 'Custom Studio Print',
            price: 899.00,
            quantity: 1,
            image: 'https://lh3.googleusercontent.com/aida-public/AB6AXuBxLYnwORZp4VWqBG6LahXcVhkv1YnhxxNoFi4BH4Ei4hkZtThUFdoDGxN6Jjh2zPVtU2XEdA8U9Bp0SlPwmTiNKNP5iy38jO0vnJasBQnrMG-86MFcYoLgeAqdX57U6ZEzMHmA3glpGmJSmvnkvcnxdBH8bE2wSteonl2YtduYesUbz-4uOHPbyoGpLxyt8g4ajoQZ0SCmiTU0wl5fekc77FfpFYp5tvfJS6C0D7DtWLQbgn-k5IWoa-WpOrV5ZvE_iFaTwn5F7iA',
            attributes: {
                customText: canvasText.innerText,
                finish: 'Matte'
            }
        };

        if (window.CartSystem) {
            window.CartSystem.addItem(item);
        }
    });

    // Tool Toggles — scoped to only the left icon sidebar
    const toolBtns = document.querySelectorAll('aside.w-12 button, aside[class*="w-12"] button');
    toolBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            toolBtns.forEach(b => {
                b.classList.remove('bg-neutral-800', 'text-[#00F0FF]');
                b.classList.add('text-neutral-500');
            });
            btn.classList.add('bg-neutral-800', 'text-[#00F0FF]');
            btn.classList.remove('text-neutral-500');
        });
    });
</script>
